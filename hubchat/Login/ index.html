<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ورود | Hubchat</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../src/output.css">
    <style>
        @font-face {
            font-family: yekan;
            src: url("../font/IRANSansWeb.ttf");
        }

        body {
            font-family: yekan;
        }
    </style>

<body class="flex min-h-screen items-center justify-center p-4 bg-[#101510]">
    <main class="relative w-full max-w-md rounded-[2rem] border border-white/10 bg-[#1c211c] p-6 shadow-2xl sm:p-10">
        <div class="mb-8 flex items-center justify-center gap-2 text-emerald-300">
            <svg class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
            </svg>
            <span class="text-2xl font-bold tracking-tight">Hubchat</span>
        </div>ّ
        <form action="#" method="get" class="flex flex-col gap-6">
            <p class="text-center text-2xl text-emerald-300">چه اسمی برای نمایش به بقیه بزاریم؟</p>
            <p class="text-stone-500 text-center text-sm">فقط با یک اسم, بدون هیچ شماره و ایمیل ای به پیامرسانی نامحدود
                و امن دست پیدا کنید</p>
            <input id="name" name="name" type="text" required minlength="2" maxlength="30" placeholder=" نام شما "
                class="peer h-14 w-full rounded-3xl border border-stone-600 bg-transparent px-4 text-stone-200 outline-none transition-colors hover:border-stone-400 focus:border-emerald-300 focus:ring-1 focus:ring-emerald-300">


            <button type="submit"
                class="flex h-14 items-center justify-center gap-2 rounded-full bg-emerald-300 font-bold text-emerald-950 transition hover:bg-emerald-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 active:scale-[.98] ">
                ورود به پیام رسان <svg xmlns="http://www.w3.org/2000/svg" class="w-10"
                    viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM199 303L279 223C288.4 213.6 303.6 213.6 312.9 223C322.2 232.4 322.3 247.6 312.9 256.9L273.9 295.9L424 295.9C437.3 295.9 448 306.6 448 319.9C448 333.2 437.3 343.9 424 343.9L273.9 343.9L312.9 382.9C322.3 392.3 322.3 407.5 312.9 416.8C303.5 426.1 288.3 426.2 279 416.8L199 336.8C189.6 327.4 189.6 312.2 199 302.9z" />
                </svg>
            </button>
        </form>
    </main>
